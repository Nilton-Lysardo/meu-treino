<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E232A"/>
      <stop offset="100%" stop-color="#0F1115"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#FF3D00"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Halter moderno estilizado -->
  <g transform="translate(256,256) rotate(-45) translate(-256,-256)">
    <!-- Barra central -->
    <rect x="140" y="240" width="232" height="32" rx="16" fill="#FFFFFF"/>
    <!-- Anilhas Esquerdas -->
    <rect x="90" y="196" width="30" height="120" rx="12" fill="url(#accent)"/>
    <rect x="125" y="216" width="20" height="80" rx="8" fill="#E2E8F0"/>
    <rect x="65" y="216" width="20" height="80" rx="8" fill="#FF8A3D"/>
    <!-- Anilhas Direitas -->
    <rect x="392" y="196" width="30" height="120" rx="12" fill="url(#accent)"/>
    <rect x="367" y="216" width="20" height="80" rx="8" fill="#E2E8F0"/>
    <rect x="427" y="216" width="20" height="80" rx="8" fill="#FF8A3D"/>
  </g>
  <!-- Chama da hipertrofia no topo -->
  <circle cx="256" cy="140" r="18" fill="url(#accent)"/>
</svg>
